name: WINDOWS TAILSCALE RDP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd1234" -Force)
    - name: Install Tailscale
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe
        Start-Process -FilePath .\tailscale-setup.exe -ArgumentList "/S" -Wait
        Start-Sleep 10
    - name: Connect Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-rdp
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4
    - name: Keep Alive
      run: |
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        echo "===== RDP SIAP!!! ====="
        echo "IP: $ip"
        echo "Username: runneradmin"
        echo "Password: P@ssw0rd1234"
        while ($true) { Write-Output "$(Get-Date) - Running $ip"; Start-Sleep 300 }
